version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medscope}
      POSTGRES_USER: ${POSTGRES_USER:-medscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - medscope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medscope}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medscope_postgres_data:
